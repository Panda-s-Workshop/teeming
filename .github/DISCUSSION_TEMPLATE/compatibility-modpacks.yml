body:
  - type: markdown
    attributes:
      value: |
        Ask whether mods work together, share setups that work, or get help putting Teeming in a modpack (spawn settings and biome tags for modded biomes, balancing mob counts, servers). When a reply answers it, mark it as the answer so others can find it.

        If something is broken with another mod, [report a conflict with another mod](https://github.com/Panda-s-Workshop/teeming/issues/new?template=3-mod-conflict.yml) instead.

  - type: textarea
    id: topic
    attributes:
      label: Your question or finding
      placeholder: Can I add a modded biome to a mob's spawn tag so it spawns there too?
    validations:
      required: true

  - type: input
    id: mods
    attributes:
      label: The mods, datapacks or modpack involved
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Teeming version
      placeholder: 0.1.0
    validations:
      required: false
