name: 🐢 Performance problem
description: Lag with many Teeming mobs, a slow server, or high memory use.
labels: ["type: performance", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        A profile shows where the time goes, and is the most useful thing you can send.

  - type: textarea
    id: what
    attributes:
      label: What's slow?
      placeholder: Lag in the End with many Teeming mobs near the outer islands.
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile
      description: A [spark](https://spark.lucko.me) profile taken while it's slow (`/spark profiler start`, wait a minute, `/spark profiler stop`) gives the most to go on.
      placeholder: https://spark.lucko.me/...
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: Hardware and memory
      description: CPU, how much memory the game or server is given (-Xmx), singleplayer or dedicated server.
      placeholder: Ryzen 5 5600, 6 GB, singleplayer
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Overworld mobs
        - Nether mobs
        - End mobs
        - Spawning (where, how many)
        - Field Guide
        - Trophies
        - Drops, recipes, brewing and charms
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Teeming version
      description: From the jar's name or the mods list, such as 0.1.0.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      description: Teeming is for Minecraft 26.3 on NeoForge and Fabric.
      options:
        - NeoForge
        - Fabric
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader version
      description: The NeoForge version, or the Fabric Loader and Fabric API versions.
      placeholder: NeoForge 26.3.0.89, or Fabric Loader 0.19.5 with Fabric API 0.161.0+26.3
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Your mod list, the modpack's name and version, or "none". Performance mods and mods that change spawning matter most.
    validations:
      required: true
